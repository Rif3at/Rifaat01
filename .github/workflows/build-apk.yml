name: Build VAT Calculator APK

on:
  push:
    paths:
      - 'calculator/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sync web app into Android assets
        run: cp calculator/index.html calculator/icon.svg android/app/src/main/assets/

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VAT-Calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VAT-Calculator-apk
          path: VAT-Calculator.apk

      # Publish the APK as a Release so it has a permanent direct download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/VAT-Calculator.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" VAT-Calculator.apk --clobber
          else
            gh release create "$TAG" VAT-Calculator.apk \
              --target "$GITHUB_SHA" \
              --title "حاسبة الضريبة v1.0" \
              --notes "حاسبة ضريبة القيمة المضافة 15% مع زر إضافة الضريبة (+) وزر استخراجها (−). للتثبيت: حمّل VAT-Calculator.apk واسمح بالتثبيت من مصادر غير معروفة. يتطلب Android 7 أو أحدث." \
              --latest
          fi
