name: Build VAT Calculator APK

on:
  push:
    paths:
      - 'calculator/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sync web app into Android assets
        run: cp calculator/index.html calculator/icon.svg android/app/src/main/assets/

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VAT-Calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VAT-Calculator-apk
          path: VAT-Calculator.apk
