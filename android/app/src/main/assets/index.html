<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>حاسبة الضريبة</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #f1f5f9; --panel: #ffffff; --text: #0f172a; --muted: #64748b;
    --key: #e2e8f0; --key-text: #0f172a; --op: #cbd5e1;
    --accent: #2563eb; --accent-text: #fff;
    --plus: #16a34a; --minus: #dc2626; --border: #e2e8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --panel: #111827; --text: #f8fafc; --muted: #94a3b8;
      --key: #1f2937; --key-text: #f8fafc; --op: #334155;
      --accent: #3b82f6; --border: #1f2937;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    display: flex; justify-content: center; padding: 16px;
  }
  .app { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.1rem; margin: 0; }
  .rate { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }
  .rate input {
    width: 64px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 1rem; text-align: center;
  }
  .screen {
    background: var(--panel); border-radius: 16px; padding: 16px; min-height: 120px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
    direction: ltr; overflow: hidden;
  }
  .expr { color: var(--muted); font-size: 1rem; min-height: 1.4em; word-break: break-all; text-align: left; width: 100%; }
  .value { font-size: 2.6rem; font-weight: 600; word-break: break-all; text-align: left; width: 100%; font-variant-numeric: tabular-nums; }
  .breakdown {
    background: var(--panel); border-radius: 16px; padding: 12px 16px; display: none;
    grid-template-columns: 1fr auto; gap: 6px 12px; font-size: .95rem;
  }
  .breakdown.show { display: grid; }
  .breakdown .lbl { color: var(--muted); }
  .breakdown .num { direction: ltr; text-align: left; font-variant-numeric: tabular-nums; font-weight: 600; }
  .breakdown .total { border-top: 1px solid var(--border); padding-top: 6px; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; direction: ltr; }
  button {
    border: 0; border-radius: 14px; padding: 18px 0; font-size: 1.35rem; font-weight: 500;
    background: var(--key); color: var(--key-text); cursor: pointer; user-select: none;
    font-family: inherit; transition: transform .05s, filter .1s;
  }
  button:active { transform: scale(.96); filter: brightness(.9); }
  button:focus:not(:focus-visible) { outline: none; }
  .op { background: var(--op); }
  .eq { background: var(--accent); color: var(--accent-text); }
  .tax { font-size: 1.05rem; font-weight: 700; color: #fff; padding: 16px 0; }
  .tax small { display: block; font-size: .72rem; font-weight: 500; opacity: .9; margin-top: 2px; }
  .tax.plus { background: var(--plus); }
  .tax.minus { background: var(--minus); }
  .span2 { grid-column: span 2; }
  .history { background: var(--panel); border-radius: 16px; padding: 12px 16px; font-size: .9rem; }
  .history h2 { font-size: .95rem; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .history h2 button { font-size: .8rem; padding: 4px 10px; border-radius: 8px; }
  .history ul { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow-y: auto; }
  .history li { padding: 6px 0; border-bottom: 1px solid var(--border); direction: ltr; text-align: left; cursor: pointer; }
  .history li:last-child { border-bottom: 0; }
  .history .empty { color: var(--muted); direction: rtl; text-align: right; cursor: default; }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>حاسبة ضريبة القيمة المضافة</h1>
    <label class="rate">النسبة %
      <input id="rate" type="number" inputmode="decimal" min="0" max="100" step="0.01" value="15">
    </label>
  </header>

  <section class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </section>

  <section class="breakdown" id="breakdown">
    <span class="lbl">المبلغ قبل الضريبة</span><span class="num" id="bNet"></span>
    <span class="lbl" id="bTaxLbl">الضريبة</span><span class="num" id="bTax"></span>
    <span class="lbl total">الإجمالي شامل الضريبة</span><span class="num total" id="bGross"></span>
  </section>

  <section class="keys">
    <button class="tax plus span2" data-act="taxPlus">+ ضريبة<small>إضافة الضريبة</small></button>
    <button class="tax minus span2" data-act="taxMinus">− ضريبة<small>استخراج / خصم الضريبة</small></button>

    <button class="op" data-act="clear">AC</button>
    <button class="op" data-act="back">⌫</button>
    <button class="op" data-act="percent">%</button>
    <button class="op" data-op="/">÷</button>

    <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
    <button class="op" data-op="*">×</button>

    <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
    <button class="op" data-op="-">−</button>

    <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button data-act="sign">±</button>
    <button data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="eq" data-act="equals">=</button>
  </section>

  <section class="history">
    <h2>السجل <button data-act="clearHistory">مسح</button></h2>
    <ul id="history"><li class="empty">لا توجد عمليات بعد</li></ul>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  const PREC = { '+': 1, '-': 1, '*': 2, '/': 2 };

  // tokens: numbers stored as strings while typing; ops as symbols
  let tokens = [];      // completed tokens, e.g. ['100', '+', '50']
  let current = '0';    // number being typed
  let justEvaluated = false;
  let history = [];

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // Round to avoid binary floating noise (e.g. 0.1+0.2)
  const clean = n => Number.isFinite(n) ? parseFloat(n.toPrecision(12)) : n;
  const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
  const fmt = (n, dp) => {
    if (!Number.isFinite(n)) return 'خطأ';
    const opts = dp === undefined
      ? { maximumFractionDigits: 10 }
      : { minimumFractionDigits: dp, maximumFractionDigits: dp };
    return n.toLocaleString('en-US', opts);
  };
  const fmtTyping = s => {
    const neg = s.startsWith('-');
    const body = neg ? s.slice(1) : s;
    const [i, d] = body.split('.');
    const intPart = Number(i || '0').toLocaleString('en-US');
    return (neg ? '-' : '') + intPart + (d !== undefined ? '.' + d : '');
  };

  function evaluate(list) {
    // shunting-yard on a flat token list [num, op, num, ...]
    const out = [], stack = [];
    for (const t of list) {
      if (t in PREC) {
        while (stack.length && PREC[stack[stack.length - 1]] >= PREC[t]) out.push(stack.pop());
        stack.push(t);
      } else out.push(parseFloat(t));
    }
    while (stack.length) out.push(stack.pop());
    const st = [];
    for (const t of out) {
      if (typeof t === 'number') { st.push(t); continue; }
      const b = st.pop(), a = st.pop();
      st.push(t === '+' ? a + b : t === '-' ? a - b : t === '*' ? a * b : a / b);
    }
    return clean(st[0]);
  }

  const rate = () => {
    const r = parseFloat($('rate').value);
    return Number.isFinite(r) && r >= 0 ? r : 0;
  };

  function exprText() {
    return tokens.map(t => OPS[t] || fmtTyping(t)).join(' ');
  }

  function render() {
    $('expr').textContent = exprText();
    $('value').textContent = current === 'Error' ? 'خطأ' : fmtTyping(current);
  }

  function hideBreakdown() { $('breakdown').classList.remove('show'); }

  function showBreakdown(net, tax, gross, mode) {
    $('bNet').textContent = fmt(net, 2);
    $('bTax').textContent = fmt(tax, 2);
    $('bGross').textContent = fmt(gross, 2);
    $('bTaxLbl').textContent = `الضريبة ${rate()}%` + (mode === 'minus' ? ' (مستخرجة)' : ' (مضافة)');
    $('breakdown').classList.add('show');
  }

  function addHistory(text, result) {
    history.unshift({ text, result });
    history = history.slice(0, 50);
    store.set('vatcalc.history', history);
    renderHistory();
  }

  function renderHistory() {
    const ul = $('history');
    ul.innerHTML = '';
    if (!history.length) {
      ul.innerHTML = '<li class="empty">لا توجد عمليات بعد</li>';
      return;
    }
    for (const h of history) {
      const li = document.createElement('li');
      li.textContent = `${h.text} = ${fmt(h.result)}`;
      li.title = 'اضغط لاستخدام النتيجة';
      li.onclick = () => { tokens = []; current = String(h.result); justEvaluated = true; hideBreakdown(); render(); };
      ul.appendChild(li);
    }
  }

  // Evaluate pending expression to a single value (used by = and tax buttons)
  function resolveValue() {
    let list = [...tokens, current];
    if (list.length > 1 && list[list.length - 1] in PREC) list.pop();
    return { value: list.length > 1 ? evaluate(list) : clean(parseFloat(current)), text: list.map(t => OPS[t] || fmtTyping(t)).join(' ') };
  }

  const actions = {
    num(d) {
      if (current === 'Error') current = '0';
      if (justEvaluated) { tokens = []; current = '0'; justEvaluated = false; }
      hideBreakdown();
      if (d === '.') { if (!current.includes('.')) current += '.'; }
      else if (current === '0') current = d;
      else if (current === '-0') current = '-' + d;
      else if (current.replace(/[-.]/g, '').length < 15) current += d;
      render();
    },
    op(o) {
      if (current === 'Error') return;
      justEvaluated = false;
      hideBreakdown();
      // replace operator if user presses two in a row
      if (current === '' && tokens.length) { tokens[tokens.length - 1] = o; render(); return; }
      tokens.push(current, o);
      current = '';
      $('expr').textContent = exprText();
      $('value').textContent = fmtTyping(tokens[tokens.length - 2]);
    },
    equals() {
      if (!tokens.length || current === 'Error') return;
      if (current === '') current = tokens[tokens.length - 2];
      const { value, text } = resolveValue();
      tokens = [];
      current = Number.isFinite(value) ? String(value) : 'Error';
      justEvaluated = true;
      if (current !== 'Error') addHistory(text, value);
      render();
      $('expr').textContent = text + ' =';
    },
    clear() { tokens = []; current = '0'; justEvaluated = false; hideBreakdown(); render(); },
    back() {
      if (justEvaluated || current === 'Error') return actions.clear();
      current = current.length > 1 && current !== '-0' ? current.slice(0, -1) : '0';
      if (current === '-') current = '0';
      render();
    },
    sign() {
      if (current === '' || current === 'Error') return;
      current = current.startsWith('-') ? current.slice(1) : '-' + current;
      render();
    },
    percent() {
      if (current === '' || current === 'Error') return;
      const v = parseFloat(current);
      // 200 + 10% => 200 + 20 ; standalone 10% => 0.1
      const prev = tokens.length >= 2 ? evaluate(tokens.slice(0, -1)) : null;
      const lastOp = tokens[tokens.length - 1];
      current = String(clean(prev !== null && (lastOp === '+' || lastOp === '-') ? prev * v / 100 : v / 100));
      render();
    },
    taxPlus() { applyTax('plus'); },
    taxMinus() { applyTax('minus'); },
    clearHistory() { history = []; store.set('vatcalc.history', history); renderHistory(); }
  };

  function applyTax(mode) {
    if (current === 'Error') return;
    if (current === '' && tokens.length) current = tokens[tokens.length - 2];
    const { value: base, text } = resolveValue();
    if (!Number.isFinite(base)) return;
    const r = rate() / 100;
    let net, tax, gross, result;
    if (mode === 'plus') {
      // amount is before tax → add tax
      net = base; tax = round2(base * r); gross = round2(net + tax); result = gross;
    } else {
      // amount includes tax → extract tax and get net
      gross = base; net = round2(base / (1 + r)); tax = round2(gross - net); result = net;
    }
    tokens = [];
    current = String(result);
    justEvaluated = true;
    const label = mode === 'plus' ? `+VAT ${rate()}%` : `−VAT ${rate()}%`;
    const base_ = text.includes(' ') ? `(${text})` : text;
    addHistory(`${base_} ${label}`, result);
    render();
    $('expr').textContent = `${base_} ${label} =`;
    showBreakdown(net, tax, gross, mode);
  }

  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.num) actions.num(b.dataset.num);
    else if (b.dataset.op) actions.op(b.dataset.op);
    else if (b.dataset.act) actions[b.dataset.act]();
  });
  document.querySelector('.history h2 button').addEventListener('click', actions.clearHistory);

  document.addEventListener('keydown', e => {
    if (e.target.id === 'rate') return;
    const k = e.key;
    if (/^[0-9.]$/.test(k)) actions.num(k);
    else if (k in PREC) actions.op(k);
    else if (k === 'Enter' || k === '=') { e.preventDefault(); actions.equals(); }
    else if (k === 'Backspace') actions.back();
    else if (k === 'Escape') actions.clear();
    else if (k === '%') actions.percent();
    else if (k === 't' || k === 'T') actions.taxPlus();
    else if (k === 'r' || k === 'R') actions.taxMinus();
  });

  $('rate').value = store.get('vatcalc.rate', 15);
  $('rate').addEventListener('change', () => { store.set('vatcalc.rate', rate()); hideBreakdown(); });
  history = store.get('vatcalc.history', []);
  renderHistory();
  render();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
